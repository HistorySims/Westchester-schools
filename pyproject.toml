[project]
name = "herald"
version = "0.1.0"
description = "Westchester schools research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "hdbscan>=0.8.33",
    "httpx>=0.27",
    "numpy>=1.26",
    "pgvector>=0.3",
    "pillow>=10.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "rich>=13.7",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "umap-learn>=0.5",
]

[project.scripts]
herald = "herald.cli:app"
herald-scrape = "herald.scrape.__main__:app"
herald-ingest = "herald.ingest_schools:app"
herald-ask = "herald.ask_schools:app"
herald-cluster = "herald.cluster_schools:app"
herald-score = "herald.score_schools:app"
herald-extract = "herald.extract_schools:app"
herald-eval = "herald.eval_schools:app"
herald-migrate = "herald.migrate:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "pyright>=1.1.370",
]
# Analysis-only group: one-off diagnostic scripts under scripts/.
# Do NOT promote these to runtime `dependencies`. Install with
# `uv sync --group analysis` (or `uv pip install bertopic`).
analysis = [
    "bertopic>=0.16",
]
# Headless-browser group: the policy portals are Blazor Server apps whose
# text only exists after the client renders, so they need a real browser.
# Install with `uv sync --group browser` (CI does this in policy-fetch.yml).
browser = [
    "playwright>=1.48",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Inherited newspaper-engine modules, pending their schools rewrite
# (docs/ENGINE_EXTRACTION.md). Don't grow these lists — new code lints clean.
"src/herald/classify.py" = ["E501", "SIM103"]
"src/herald/cluster.py" = ["E402", "E501", "SIM113", "UP035"]
"src/herald/models.py" = ["E501"]
"src/herald/quality.py" = ["I001", "UP017"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
# `tests/` has no __init__.py; pytest puts the repo root on sys.path at runtime,
# which is how `from tests.test_ingest_schools import ...` resolves. Tell pyright
# the same thing so shared test helpers are not reported as missing imports.
extraPaths = ["."]
typeCheckingMode = "basic"
reportMissingImports = "error"
# Optional dependency groups are not installed in the default environment, and
# every use of them is already behind a runtime guard or a local import. An
# unresolved `playwright` here means "not installed", not "broken".
reportMissingModuleSource = "none"
ignore = [
    # Inherited newspaper-engine modules, pending their schools rewrite
    # (docs/ENGINE_EXTRACTION.md). Same list and same reason as ruff's
    # per-file-ignores; type-annotating code that is scheduled to be replaced
    # buys nothing. Don't grow this list — new code type-checks clean.
    "src/herald/classify.py",
    "src/herald/cluster.py",
    "src/herald/models.py",
    "src/herald/quality.py",
    "src/herald/retrieval.py",
    "src/herald/db.py",
    "src/herald/chunker.py",
    "src/herald/synth.py",
]

[[tool.pyright.executionEnvironments]]
# Tests build partial fixtures on purpose — a dict standing in for a response,
# a parse result used without a None check because the test should fail loudly
# if it is None. Asserting those away to satisfy the checker makes the tests
# say less about intent, so the rules that fire on deliberate looseness are off
# here. Imports and attribute access are still checked, which is what catches a
# test referencing something that no longer exists.
root = "tests"
reportArgumentType = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportIndexIssue = "none"
reportCallIssue = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
