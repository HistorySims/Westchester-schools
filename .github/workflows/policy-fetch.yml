name: policy-fetch

# Pull whole ADOPTED POLICY MANUALS out of the BoardPolicyOnline portals.
#
# This closes the corpus's biggest hole. Until now we held only whatever loose
# policy PDFs a district website happened to link (Port Chester: 13 documents,
# out of a manual of 500+), so "which districts have policy X" answered with
# confident false negatives.
#
# The manual is a Blazor Server app: no REST API, no fetchable HTML — every
# byte of policy text is rendered server-side and pushed over a WebSocket. So
# this drives a real browser, uses the portal's own bulk export (select the
# whole table of contents, Print), and splits the returned HTML into one
# document per policy. Each keeps the portal's deep link
# (/b/<slug>/s/<id>) as its source_url, so answers can cite the live manual.
#
#   Actions -> policy-fetch -> Run workflow
#
# That is the whole thing: the job ingests what it fetched before it finishes,
# because the files are already on its disk. Shipping them out as an artifact
# and back into a second run only existed to move bytes between two runners.
# Set `ingest: no` to fetch without touching the corpus; the artifact is
# uploaded either way, so `ingest` can still be run against it later.
#
# Secrets (only when ingest = write):
#   SUPABASE_DB_URL  - Supabase session-mode pooler connection string
#   VOYAGE_API_KEY   - Voyage AI key (voyage-3.5)

on:
  workflow_dispatch:
    inputs:
      district:
        description: "District to fetch (all = every supported district)"
        type: choice
        options:
          - all
          - port-chester-rye
          - peekskill
          - ossining
          - elmsford
          - tarrytowns
          - mount-vernon
          - greenburgh-central
          - white-plains
        default: all
      dry_run:
        description: "Fetch + split, but write nothing"
        type: boolean
        default: false
      keep_dividers:
        description: "Also store section dividers (a title with no policy text)"
        type: boolean
        default: false
      export_timeout:
        description: "Seconds to wait for the server-side export"
        type: string
        default: "300"

      ingest:
        description: "Ingest into the corpus when the fetch finishes"
        type: choice
        options:
          - write
          - dry-run
          - "no"
        default: write

concurrency:
  group: policy-fetch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync deps (with the headless-browser group)
        run: uv sync --frozen --group browser
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Fetch policy manuals
        run: |
          uv run herald-scrape policy-fetch \
            --targets data/targets/policy_portals.json \
            ${{ inputs.district != 'all' && format('--only "{0}"', inputs.district) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.keep_dividers && '--keep-dividers' || '' }} \
            --export-timeout "${{ inputs.export_timeout }}" \
            --out data/raw \
            --report policy-fetch.md
      - name: Publish report to run summary
        if: always()
        run: cat policy-fetch.md >> "$GITHUB_STEP_SUMMARY" || echo "(no report)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sanity-check secrets (real ingest only)
        if: ${{ inputs.ingest == 'write' }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          [ -n "$VOYAGE_API_KEY" ]  || { echo "VOYAGE_API_KEY secret is missing"; exit 1; }
          echo "secrets present (lengths only): db=${#SUPABASE_DB_URL} voyage=${#VOYAGE_API_KEY}"
      - name: Ingest
        if: ${{ inputs.ingest != 'no' && !inputs.dry_run }}
        run: |
          uv run herald-ingest run \
            --root data/raw \
            --report ingest-report.md \
            ${{ inputs.ingest == 'write' && '--no-dry-run' || '--dry-run' }}
      - name: Publish ingest report to run summary
        if: ${{ always() && inputs.ingest != 'no' && !inputs.dry_run }}
        run: cat ingest-report.md >> "$GITHUB_STEP_SUMMARY" || echo "(no ingest report)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fetched policies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policies
          path: |
            data/raw/**
            policy-fetch.md
          if-no-files-found: warn
          retention-days: 14
