name: ocr

# OCR the scanned (no-text) documents from a scrape run and add their
# chunks to the corpus. Reprocesses only documents that yielded no text on
# the normal ingest: rasterize with PyMuPDF, then either
#   * tesseract — CPU, free, prose only; or
#   * vision    — Claude transcribes each page to Markdown, KEEPING salary
#                 grids as tables so herald-extract can read them into
#                 salary_schedule (the path for the scanned teacher CBAs).
# then chunk -> embed -> write, updating each document row in place.
#
#   Actions -> ocr -> Run workflow
#
# The dry run (default) just counts OCR candidates per district — fast, no
# engine, no secrets — so you can confirm the set before spending on a pass.
#
# Required secrets for a real run (not the dry run):
#   SUPABASE_DB_URL, VOYAGE_API_KEY, and (engine=vision) ANTHROPIC_API_KEY
#
# Note: OCR needs the original files, which live in the scrape run's
# artifacts (14-day retention). Run before they expire. For the teacher
# CBAs, use the crawl-contracts download run id (e.g. 31863253727).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id of the scrape run whose no-text docs to OCR"
        required: true
        type: string
      district:
        description: "District to scope to (all = every district)"
        type: choice
        options:
          - all
          - port-chester-rye
          - ossining
          - peekskill
          - tarrytowns
          - elmsford
          - mount-vernon
          - greenburgh-central
          - white-plains
        default: all
      engine:
        description: "OCR engine: tesseract (prose, free) or vision (Claude, keeps salary grids)"
        type: choice
        options: ["tesseract", "vision"]
        default: "vision"
      reocr:
        description: "Re-OCR docs already OCR'd (upgrade a Tesseract pass to vision), replacing their chunks"
        type: boolean
        default: false
      dpi:
        description: "Rasterization DPI for OCR"
        type: string
        default: "300"
      limit:
        description: "Stop after N documents (empty = all)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Count OCR candidates only; no OCR, no DB writes"
        type: boolean
        default: true

concurrency:
  group: ocr
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # download artifacts from another run

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync deps
        run: uv sync --frozen
      # Needed by both engines: the tesseract engine transcribes with it, and
      # the vision engine uses its orientation detection (OSD) to straighten
      # sideways-scanned pages before transcription.
      - name: Install Tesseract
        if: ${{ !inputs.dry_run }}
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-osd
      - name: Sanity-check secrets (real run only)
        if: ${{ !inputs.dry_run }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          [ -n "$VOYAGE_API_KEY" ]  || { echo "VOYAGE_API_KEY secret is missing"; exit 1; }
          if [ "${{ inputs.engine }}" = "vision" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret is missing (needed for engine=vision)"; exit 1
          fi
          echo "secrets present (lengths only): db=${#SUPABASE_DB_URL} voyage=${#VOYAGE_API_KEY} anthropic=${#ANTHROPIC_API_KEY}"
      - name: Download scrape artifacts (run ${{ inputs.run_id }})
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/artifacts
      - name: OCR
        run: |
          uv run herald-ingest ocr \
            --root data/artifacts \
            --engine "${{ inputs.engine }}" \
            --dpi "${{ inputs.dpi }}" \
            ${{ inputs.reocr && '--reocr' || '--no-reocr' }} \
            ${{ inputs.district != 'all' && format('--district "{0}"', inputs.district) || '' }} \
            ${{ inputs.limit && format('--limit "{0}"', inputs.limit) || '' }} \
            --report ocr-report.md \
            ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
      - name: Publish report to run summary
        if: always()
        run: cat ocr-report.md >> "$GITHUB_STEP_SUMMARY" || echo "(no report)" >> "$GITHUB_STEP_SUMMARY"
