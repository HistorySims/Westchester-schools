name: ocr

# OCR the scanned (no-text) documents from a scrape run and add their
# chunks to the corpus. Reprocesses only documents that yielded no text on
# the normal ingest: rasterize with PyMuPDF, then either
#   * tesseract — CPU, free, prose only; or
#   * vision    — Claude transcribes each page to Markdown, KEEPING salary
#                 grids as tables so herald-extract can read them into
#                 salary_schedule (the path for the scanned teacher CBAs).
# then chunk -> embed -> write, updating each document row in place.
#
#   Actions -> ocr -> Run workflow
#
# The dry run (default) just counts OCR candidates per district — fast, no
# engine, no secrets — so you can confirm the set before spending on a pass.
#
# Required secrets for a real run (not the dry run):
#   SUPABASE_DB_URL, VOYAGE_API_KEY, and (engine=vision) ANTHROPIC_API_KEY
#
# Note: OCR needs the original files, which live in the scrape run's
# artifacts (14-day retention), so pick the workflow that downloaded them —
# crawl-contracts for the teacher CBAs. The latest successful run of that
# workflow is found automatically; run_id is only for reaching an older one,
# and if the artifacts have expired you must re-run the crawl first.

on:
  workflow_dispatch:
    inputs:
      from_workflow:
        description: "OCR the LATEST successful run of this workflow (no run id needed)"
        type: choice
        options:
          - crawl-contracts
          - crawl-sites
          - scrape-all
          - policy-fetch
          - policy-boarddocs
          - "(use run_id below)"
        default: crawl-contracts
      run_id:
        description: "Specific run id — DIGITS ONLY, and only to reach an OLDER run"
        required: false
        type: string
        default: ""
      district:
        description: "District to scope to (all = every district)"
        type: choice
        options:
          - all
          - port-chester-rye
          - ossining
          - peekskill
          - tarrytowns
          - elmsford
          - mount-vernon
          - greenburgh-central
          - white-plains
        default: all
      engine:
        description: "OCR engine: tesseract (prose, free) or vision (Claude, keeps salary grids)"
        type: choice
        options: ["tesseract", "vision"]
        default: "vision"
      partial:
        description: "Also OCR scanned pages INSIDE docs that otherwise have text"
        type: boolean
        default: false
      reocr:
        description: "Re-OCR docs already OCR'd (upgrade a Tesseract pass to vision), replacing their chunks"
        type: boolean
        default: false
      dpi:
        description: "Rasterization DPI for OCR"
        type: string
        default: "300"
      limit:
        description: "Stop after N documents (empty = all)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Count OCR candidates only; no OCR, no DB writes"
        type: boolean
        default: true

concurrency:
  group: ocr
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # download artifacts from another run

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync deps
        run: uv sync --frozen
      # Needed by both engines: the tesseract engine transcribes with it, and
      # the vision engine uses its orientation detection (OSD) to straighten
      # sideways-scanned pages before transcription.
      - name: Install Tesseract
        if: ${{ !inputs.dry_run }}
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-osd
      - name: Sanity-check secrets (real run only)
        if: ${{ !inputs.dry_run }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          [ -n "$VOYAGE_API_KEY" ]  || { echo "VOYAGE_API_KEY secret is missing"; exit 1; }
          if [ "${{ inputs.engine }}" = "vision" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret is missing (needed for engine=vision)"; exit 1
          fi
          echo "secrets present (lengths only): db=${#SUPABASE_DB_URL} voyage=${#VOYAGE_API_KEY} anthropic=${#ANTHROPIC_API_KEY}"
      - name: Resolve the run to OCR
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ inputs.from_workflow }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          # A run id typed into the wrong box used to reach download-artifact as
          # "workflow run NaN" and fail with a bare "Not Found". Catch it here,
          # where the message can say what actually went wrong.
          if [ -n "$RUN_ID" ]; then
            case "$RUN_ID" in
              ''|*[!0-9]*)
                echo "run_id must be digits only — got '$RUN_ID'." >&2
                echo "That looks like a district. Leave run_id empty and use the" >&2
                echo "'District to scope to' dropdown instead." >&2
                exit 1 ;;
            esac
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "using run $RUN_ID (explicit)"
            exit 0
          fi
          if [ "$WF" = "(use run_id below)" ]; then
            echo "Pick a workflow, or paste a run id." >&2
            exit 1
          fi
          resolved=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF.yml/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // ""')
          [ -n "$resolved" ] || { echo "No successful $WF run to OCR." >&2; exit 1; }
          echo "run_id=$resolved" >> "$GITHUB_OUTPUT"
          echo "using latest successful $WF run: $resolved"
          echo "-> https://github.com/${{ github.repository }}/actions/runs/$resolved" >> "$GITHUB_STEP_SUMMARY"
      - name: Download scrape artifacts (run ${{ steps.resolve.outputs.run_id }})
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/artifacts
      - name: OCR
        run: |
          uv run herald-ingest ocr \
            --root data/artifacts \
            --engine "${{ inputs.engine }}" \
            --dpi "${{ inputs.dpi }}" \
            ${{ inputs.partial && '--partial' || '--no-partial' }} \
            ${{ inputs.reocr && '--reocr' || '--no-reocr' }} \
            ${{ inputs.district != 'all' && format('--district "{0}"', inputs.district) || '' }} \
            ${{ inputs.limit && format('--limit "{0}"', inputs.limit) || '' }} \
            --report ocr-report.md \
            ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
      - name: Publish report to run summary
        if: always()
        run: cat ocr-report.md >> "$GITHUB_STEP_SUMMARY" || echo "(no report)" >> "$GITHUB_STEP_SUMMARY"
