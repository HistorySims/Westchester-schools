name: ingest

# Ingest scraped school documents into the corpus database:
# manifest -> PDF text -> structural chunks -> Voyage embeddings -> Postgres.
#
# Pick a workflow from the dropdown and this job finds its latest successful
# run by itself, downloads that run's artifacts, finds every manifest.jsonl,
# and ingests the documents they record. A run id is only needed to reach back
# to an OLDER run. Re-runs are cheap: already-ingested documents (by content
# hash) are skipped.
#
# The policy workflows ingest inline when they finish, so this is for
# re-ingesting, backfills, and the crawl workflows.
#
# 'tables_backfill' inverts that: instead of skipping ingested docs, it
# reprocesses them and adds ONLY their whole-table (kind='table') chunks —
# a non-destructive backfill for a corpus ingested before table-aware
# chunking existed. Prose chunks are left untouched; re-running is safe.
# Dry-run first to see the per-district table counts.
#
#   Actions -> ingest -> Run workflow
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL  - Supabase session-mode pooler connection string
#   VOYAGE_API_KEY   - Voyage AI key (voyage-3.5)
# Neither is needed for a dry run.

on:
  workflow_dispatch:
    inputs:
      from_workflow:
        description: "Ingest the LATEST successful run of this workflow (no run id needed)"
        type: choice
        options:
          - policy-fetch
          - policy-boarddocs
          - crawl-sites
          - scrape-all
          - crawl-contracts
          - ocr
          - "(use run_id below)"
        default: policy-fetch
      run_id:
        description: "Specific run id — only needed to ingest an OLDER run"
        required: false
        type: string
        default: ""
      district:
        description: "District to scope to (all = every district)"
        type: choice
        options:
          - all
          - port-chester-rye
          - ossining
          - peekskill
          - tarrytowns
          - elmsford
          - mount-vernon
          - greenburgh-central
          - white-plains
        default: all
      limit:
        description: "Stop after N documents (empty = all)"
        required: false
        type: string
        default: ""
      init_db:
        description: "Apply the schema first (safe to re-run; needed once on a fresh DB)"
        type: boolean
        default: false
      tables_backfill:
        description: "Backfill table chunks into already-ingested docs (adds kind='table' only)"
        type: boolean
        default: false
      dry_run:
        description: "Extract + chunk + report only; no DB writes, no Voyage"
        type: boolean
        default: true

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # download artifacts from another run

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync deps
        run: uv sync --frozen
      - name: Sanity-check secrets (real run only)
        if: ${{ !inputs.dry_run }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          [ -n "$VOYAGE_API_KEY" ]  || { echo "VOYAGE_API_KEY secret is missing"; exit 1; }
          echo "secrets present (lengths only): db=${#SUPABASE_DB_URL} voyage=${#VOYAGE_API_KEY}"
      - name: Resolve the run to ingest
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF: ${{ inputs.from_workflow }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          # An explicit run id always wins; otherwise take the newest
          # successful run of the chosen workflow, so nobody has to copy a
          # 12-digit number off a phone screen.
          if [ -n "$RUN_ID" ]; then
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "ingesting run $RUN_ID (explicit)"
            exit 0
          fi
          if [ "$WF" = "(use run_id below)" ]; then
            echo "Pick a workflow, or paste a run id." >&2
            exit 1
          fi
          resolved=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF.yml/runs?status=success&per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['id'] if r else '')")
          [ -n "$resolved" ] || { echo "No successful $WF run to ingest." >&2; exit 1; }
          echo "run_id=$resolved" >> "$GITHUB_OUTPUT"
          echo "ingesting latest successful $WF run: $resolved"
          echo "-> https://github.com/${{ github.repository }}/actions/runs/$resolved" >> "$GITHUB_STEP_SUMMARY"
      - name: Download scrape artifacts (run ${{ steps.resolve.outputs.run_id }})
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/artifacts
      - name: Apply schema
        if: ${{ inputs.init_db && !inputs.dry_run }}
        run: uv run herald-ingest init-db
      - name: Ingest
        run: |
          uv run herald-ingest ${{ inputs.tables_backfill && 'tables' || 'run' }} \
            --root data/artifacts \
            ${{ inputs.district != 'all' && format('--district "{0}"', inputs.district) || '' }} \
            ${{ inputs.limit && format('--limit "{0}"', inputs.limit) || '' }} \
            --report ingest-report.md \
            ${{ inputs.dry_run && '--dry-run' || '--no-dry-run' }}
      - name: Publish report to run summary
        if: always()
        run: cat ingest-report.md >> "$GITHUB_STEP_SUMMARY" || echo "(no report)" >> "$GITHUB_STEP_SUMMARY"
