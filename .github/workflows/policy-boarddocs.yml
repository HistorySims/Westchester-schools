name: policy-boarddocs

# The other half of the policy corpus.
#
# Four peer districts (Tarrytowns, White Plains, Mount Vernon, Greenburgh
# Central) have no external policy portal — but they serve their whole adopted
# manual through BoardDocs' own policy console. Those endpoints looked locked:
# every call answered "No Access". That was the `status` parameter, not
# authorization. `status=active` returns the full index anonymously.
#
# Each policy is stored with the district's own permalink
# (Board.nsf/goto?open&id=<unique>) as its source_url, plus the console's
# Adopted / Last Reviewed dates — metadata the portal manuals never state.
#
# Districts whose manual is on a portal are skipped, so no policy is stored
# twice; run `policy-fetch` for those.
#
#   Actions -> policy-boarddocs -> Run workflow
#
# That is the whole thing: the job ingests what it fetched before it finishes,
# because the files are already on its disk. Set `ingest: no` to fetch without
# touching the corpus; the artifact is uploaded either way, so `ingest` can
# still be run against it later.
#
# Secrets (only when ingest = write):
#   SUPABASE_DB_URL  - Supabase session-mode pooler connection string
#   VOYAGE_API_KEY   - Voyage AI key (voyage-3.5)

on:
  workflow_dispatch:
    inputs:
      district:
        description: "District to fetch (all = every district without a portal)"
        type: choice
        options:
          - all
          - tarrytowns
          - white-plains
          - mount-vernon
          - greenburgh-central
          - port-chester-rye
          - ossining
          - peekskill
          - elmsford
        default: all
      dry_run:
        description: "List the manual, but write nothing"
        type: boolean
        default: false
      limit:
        description: "Stop after N policies per district (empty = all)"
        type: string
        default: ""
      skip_portal:
        description: "Skip districts already covered by policy-fetch (recommended)"
        type: boolean
        default: true
      min_interval:
        description: "Minimum seconds between requests (politeness)"
        type: string
        default: "1"

      ingest:
        description: "Ingest into the corpus when the fetch finishes"
        type: choice
        options:
          - write
          - dry-run
          - "no"
        default: write

concurrency:
  group: policy-boarddocs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync deps
        run: uv sync --frozen
      - name: Fetch policy manuals from BoardDocs
        run: |
          uv run herald-scrape policy-boarddocs \
            --peers data/targets/port_chester_peers.json \
            ${{ inputs.district != 'all' && format('--only "{0}"', inputs.district) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.limit && format('--limit "{0}"', inputs.limit) || '' }} \
            ${{ inputs.skip_portal && '--skip-portal' || '--no-skip-portal' }} \
            --min-interval "${{ inputs.min_interval }}" \
            --out data/raw \
            --report policy-boarddocs.md
      - name: Publish report to run summary
        if: always()
        run: cat policy-boarddocs.md >> "$GITHUB_STEP_SUMMARY" || echo "(no report)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sanity-check secrets (real ingest only)
        if: ${{ inputs.ingest == 'write' }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          [ -n "$VOYAGE_API_KEY" ]  || { echo "VOYAGE_API_KEY secret is missing"; exit 1; }
          echo "secrets present (lengths only): db=${#SUPABASE_DB_URL} voyage=${#VOYAGE_API_KEY}"
      - name: Ingest
        if: ${{ inputs.ingest != 'no' && !inputs.dry_run }}
        run: |
          uv run herald-ingest run \
            --root data/raw \
            --report ingest-report.md \
            ${{ inputs.ingest == 'write' && '--no-dry-run' || '--dry-run' }}
      - name: Publish ingest report to run summary
        if: ${{ always() && inputs.ingest != 'no' && !inputs.dry_run }}
        run: cat ingest-report.md >> "$GITHUB_STEP_SUMMARY" || echo "(no ingest report)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fetched policies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policies-boarddocs
          path: |
            data/raw/**
            policy-boarddocs.md
          if-no-files-found: warn
          retention-days: 14
