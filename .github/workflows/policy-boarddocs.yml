name: policy-boarddocs

# The other half of the policy corpus.
#
# Four peer districts (Tarrytowns, White Plains, Mount Vernon, Greenburgh
# Central) have no external policy portal — but they serve their whole adopted
# manual through BoardDocs' own policy console. Those endpoints looked locked:
# every call answered "No Access". That was the `status` parameter, not
# authorization. `status=active` returns the full index anonymously.
#
# Each policy is stored with the district's own permalink
# (Board.nsf/goto?open&id=<unique>) as its source_url, plus the console's
# Adopted / Last Reviewed dates — metadata the portal manuals never state.
#
# Districts whose manual is on a portal are skipped, so no policy is stored
# twice; run `policy-fetch` for those.
#
#   Actions -> policy-boarddocs -> Run workflow
#
# That is the whole thing: the job ingests what it fetched before it finishes,
# because the files are already on its disk. Set `ingest: no` to fetch without
# touching the corpus; the artifact is uploaded either way, so `ingest` can
# still be run against it later.
#
# Secrets (only when ingest = write):
#   SUPABASE_DB_URL  - Supabase session-mode pooler connection string
#   VOYAGE_API_KEY   - Voyage AI key (voyage-3.5)

on:
  workflow_dispatch:
    inputs:
      district:
        description: "District to fetch (all = every district without a portal)"
        type: choice
        options:
          - all
          - tarrytowns
          - white-plains
          - mount-vernon
          - greenburgh-central
          - port-chester-rye
          - ossining
          - peekskill
          - elmsford
        default: all
      dry_run:
        description: "List the manual, but write nothing"
        type: boolean
        default: false
      limit:
        description: "Stop after N policies per district (empty = all)"
        type: string
        default: ""
      skip_portal:
        description: "Skip districts already covered by policy-fetch (recommended)"
        type: boolean
        default: true
      fresh:
        description: "Ignore the last run and start over (default: resume where it stopped)"
        type: boolean
        default: false
      min_interval:
        description: "Minimum seconds between requests (politeness)"
        type: string
        default: "2"

      ingest:
        description: "Ingest into the corpus when the fetch finishes"
        type: choice
        options:
          - write
          - dry-run
          - "no"
        default: write

concurrency:
  group: policy-boarddocs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # read the previous run's artifact to resume from it

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync deps
        run: uv sync --frozen
      - name: Find the previous run to resume from
        id: prev
        if: ${{ !inputs.fresh }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # BoardDocs answers a rate-tripped client with 403, and once it trips
          # the rest of the run is lost. So each run starts from the previous
          # run's manifest and skips what is already collected WITHOUT
          # requesting it, turning one impossible 1,077-policy run into a few
          # taps. The previous run is taken whatever its conclusion — a run
          # that failed partway is exactly the one worth resuming.
          prev=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/policy-boarddocs.yml/runs?per_page=20" \
            | jq -r --argjson me ${{ github.run_id }} \
                '[.workflow_runs[] | select(.id != $me and .status == "completed")][0].id // ""')
          echo "run_id=$prev" >> "$GITHUB_OUTPUT"
          echo "previous run: ${prev:-(none - first run)}"
      - name: Restore what the previous run collected
        if: ${{ !inputs.fresh && steps.prev.outputs.run_id != '' }}
        continue-on-error: true      # a missing/expired artifact just means a cold start
        uses: actions/download-artifact@v4
        with:
          name: policies-boarddocs
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Report what was restored
        run: |
          if [ -f data/raw/manifest.jsonl ]; then
            echo "resuming with $(wc -l < data/raw/manifest.jsonl) policies already collected"
          else
            echo "starting cold — no previous manifest"
          fi
      - name: Fetch policy manuals from BoardDocs
        id: fetch
        continue-on-error: true   # a blocked district must not cost us the rest
        run: |
          uv run herald-scrape policy-boarddocs \
            --peers data/targets/port_chester_peers.json \
            ${{ inputs.district != 'all' && format('--only "{0}"', inputs.district) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.limit && format('--limit "{0}"', inputs.limit) || '' }} \
            ${{ inputs.skip_portal && '--skip-portal' || '--no-skip-portal' }} \
            ${{ inputs.fresh && '--no-resume' || '--resume' }} \
            --min-interval "${{ inputs.min_interval }}" \
            --out data/raw \
            --report policy-boarddocs.md
      - name: Publish report to run summary
        if: always()
        run: cat policy-boarddocs.md >> "$GITHUB_STEP_SUMMARY" || echo "(no report)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sanity-check secrets (real ingest only)
        if: ${{ always() && inputs.ingest == 'write' }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          [ -n "$VOYAGE_API_KEY" ]  || { echo "VOYAGE_API_KEY secret is missing"; exit 1; }
          echo "secrets present (lengths only): db=${#SUPABASE_DB_URL} voyage=${#VOYAGE_API_KEY}"
      - name: Ingest
        if: ${{ always() && inputs.ingest != 'no' && !inputs.dry_run }}
        run: |
          uv run herald-ingest run \
            --root data/raw \
            --report ingest-report.md \
            ${{ inputs.ingest == 'write' && '--no-dry-run' || '--dry-run' }}
      - name: Publish ingest report to run summary
        if: ${{ always() && inputs.ingest != 'no' && !inputs.dry_run }}
        run: cat ingest-report.md >> "$GITHUB_STEP_SUMMARY" || echo "(no ingest report)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fetched policies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policies-boarddocs
          path: |
            data/raw/**
            policy-boarddocs.md
          if-no-files-found: warn
          retention-days: 14
      - name: Fail if any district returned nothing
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: |
          echo "A district came back empty — see the report above." >&2
          echo "Everything that did come back is stored, ingested and in the" >&2
          echo "artifact. Run this workflow again to resume from here." >&2
          exit 1
