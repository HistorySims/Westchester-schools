name: Seed the crawl manifest
description: >
  Restore the most recent scrape-<slug> artifact's manifest.jsonl so a crawl
  resumes instead of restarting.

inputs:
  slug:
    description: BoardDocs slug, matching the scrape-<slug> artifact name.
    required: true
  token:
    description: GITHUB_TOKEN with actions:read.
    required: true
  out:
    description: Crawl output directory (where manifest.jsonl lives).
    required: false
    default: data/raw

runs:
  using: composite
  steps:
    - name: Restore manifest for ${{ inputs.slug }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SLUG: ${{ inputs.slug }}
        OUT: ${{ inputs.out }}
      run: |
        set -uo pipefail
        # BoardDocs blocks a datacenter IP after a few dozen file downloads —
        # verified 2026-09-05: a file that 403s on a runner serves fine, with
        # identical headers, from another IP. So the block is per-IP, and
        # neither pacing nor header tuning moves it.
        #
        # The crawler already dedupes against its manifest ("crawls are
        # resumable and cheap to repeat"), but a runner checks out a clean tree
        # with no manifest — so every run re-downloaded the same first files,
        # hit the wall in the same place, and never advanced. Restoring the
        # last manifest is what turns "re-run it" into progress: each run gets
        # a fresh IP and takes the next slice.
        #
        # Seed only from a run whose INGEST SUCCEEDED.
        #
        # The manifest is a proxy for "already in the database", and that
        # proxy holds only while every crawl is followed by a successful
        # ingest. refresh run #5's ingest was killed: its documents were
        # crawled, recorded in the manifest, and never ingested. The next
        # crawl seeded from that manifest, skipped them as already-seen, and
        # their files — which lived only in that run's artifact — became
        # unreachable. Run #9 reported 261 such documents.
        #
        # The `report` job fails the whole run when the ingest fails, so a run
        # conclusion of `success` is exactly the condition that makes the
        # proxy true. Walk back to the newest artifact that satisfies it.
        #
        # Best-effort by design: no usable artifact just means a full crawl,
        # which is correct — re-downloading is safe, skipping wrongly is not.
        api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions"
        arts=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "${api}/artifacts?name=scrape-${SLUG}&per_page=20") || arts=""
        url=""
        for row in $(printf '%s' "$arts" \
                     | jq -r '.artifacts[] | select(.expired|not)
                              | "\(.workflow_run.id) \(.archive_download_url)"' \
                     | tr ' ' '|'); do
          run_id=${row%%|*}; dl=${row##*|}
          run_json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          "${api}/runs/${run_id}") || run_json=""
          concl=$(printf '%s' "$run_json" | jq -r '.conclusion // ""')
          wf=$(printf '%s' "$run_json" | jq -r '.path // ""')
          # Only THIS workflow's runs. `scrape-all` uploads artifacts under the
          # same scrape-<slug> name but has no ingest job, so it can conclude
          # `success` having stored nothing — adopting its manifest would skip
          # documents that were never ingested, which is the orphan bug over
          # again from a different direction.
          if [ "$wf" != ".github/workflows/refresh.yml" ]; then
            echo "  skipping run ${run_id} (${wf:-unknown}) — not a crawl+ingest run"
            continue
          fi
          if [ "$concl" = "success" ]; then
            echo "seeding from run ${run_id} (ingest succeeded)"
            url="$dl"; break
          fi
          echo "  skipping run ${run_id} (conclusion: ${concl:-unknown}) — its documents may never have been ingested"
        done
        if [ -z "$url" ]; then
          echo "no scrape-${SLUG} artifact from a successful run — full crawl"
          exit 0
        fi
        mkdir -p "$OUT" _seed
        if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o _seed/a.zip "$url"; then
          echo "previous artifact could not be downloaded (expired?) — full crawl"
          exit 0
        fi
        # Only the manifest: the files it names are already in the database,
        # and re-downloading gigabytes to re-skip them would defeat the point.
        unzip -o -j _seed/a.zip 'manifest.jsonl' -d "$OUT" >/dev/null 2>&1 \
          || unzip -o -j _seed/a.zip '*/manifest.jsonl' -d "$OUT" >/dev/null 2>&1 \
          || true
        rm -rf _seed
        if [ -s "$OUT/manifest.jsonl" ]; then
          echo "resuming: $(wc -l < "$OUT/manifest.jsonl") document(s) already recorded"
        else
          echo "previous artifact had no manifest — full crawl"
        fi
